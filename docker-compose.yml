services:
  # Бэкенд (Python + CUDA)
  api:
    build: ./backend
    container_name: cvproject-api
    # ports:
      # - "8000:8000"
    network_mode: "host" # ГАРАНТИРУЕТ, ЧТО PYTHON УВИДИТ СЕТЬ НОУТБУКА И ВСЕ КАМЕРЫ
    volumes:
      - ./backend:/app
      - ./backend/weights:/app/weights
    # Сигнал для мягкой остановки (Python лучше понимает SIGINT)
    stop_signal: SIGINT
    # Даем 30 секунд на очистку ресурсов перед принудительным убийством
    stop_grace_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Фронтенд (React)
  frontend:
    build: ./web
    container_name: cvproject-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      # Анонимный волюм, чтобы node_modules внутри контейнера не заменялись пустотой с хоста
      - /app/node_modules
    depends_on:
      - api

  # Аналитика GRAFANA
  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: cvproject-grafana
    network_mode: "host" # ГРАФАНА ВИДИТ ПК НАПРЯМУЮ КАК ЛОКАЛЬНАЯ ПРОГРАММА!
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always

# Объявляем волюм для сохранения дашбордов в самом низу файла
volumes:
  grafana_data: